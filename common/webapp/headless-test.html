<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BlueMap Headless Renderer Test</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            color: #f3f4f6;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        #hud {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.14);
            font-size: 12px;
            line-height: 1.4;
        }
        #hud button {
            padding: 3px 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            background: #1f2937;
            color: #f9fafb;
            font: inherit;
            cursor: pointer;
        }
        #hud button[aria-pressed="true"] {
            background: #2563eb;
            border-color: #60a5fa;
        }
        #status[data-state="error"] {
            color: #fca5a5;
        }
        #status[data-state="loaded"] {
            color: #86efac;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div id="hud">
    <span id="status" data-state="loading">Loading...</span>
    <span id="coords"></span>
    <span id="tiles">tiles: 0</span>
    <button id="btn-perspective" type="button" aria-pressed="true">Perspective</button>
    <button id="btn-flat" type="button" aria-pressed="false">Flat</button>
</div>
<script type="module">
    const params = new URLSearchParams(window.location.search);
    const rendererUrl = params.get("renderer") || "./dist-renderer/bluemap-renderer.js";
    const statusEl = document.getElementById("status");
    const coordsEl = document.getElementById("coords");
    const tilesEl = document.getElementById("tiles");
    const perspectiveBtn = document.getElementById("btn-perspective");
    const flatBtn = document.getElementById("btn-flat");
    const mapEl = document.getElementById("map");

    function numberParam(name) {
        const raw = params.get(name);
        if (raw === null || raw === "") return undefined;
        const parsed = Number(raw);
        return Number.isFinite(parsed) ? parsed : undefined;
    }

    async function readRootSettings(settingsUrl) {
        try {
            const response = await fetch(settingsUrl, {cache: "no-store"});
            if (!response.ok) return null;
            return await response.json();
        } catch {
            return null;
        }
    }

    async function start() {
        const {mountHeadlessMap} = await import(rendererUrl);

        const settingsUrl = params.get("settings") || "./settings.json";
        const rootSettings = params.has("map") && params.has("mapDataRoot")
            ? null
            : await readRootSettings(settingsUrl);

        const mapId = params.get("map")
            || (Array.isArray(rootSettings?.maps) && rootSettings.maps[0])
            || "world";
        const mapsRoot = (params.get("root") || rootSettings?.mapDataRoot || "./maps").replace(/\/+$/, "");
        const mapDataRoot = params.get("mapDataRoot") || `${mapsRoot}/${mapId}`;
        const clientDecompression = params.has("clientDecompression")
            ? params.get("clientDecompression") === "true"
            : Boolean(rootSettings?.clientDecompression);

        const x = numberParam("x");
        const z = numberParam("z");
        const distance = numberParam("distance");
        const view = params.get("view") === "flat" ? "flat" : "perspective";

        let loadedTiles = 0;
        mapEl.addEventListener("bluemapMapTileLoaded", () => {
            loadedTiles += 1;
            tilesEl.textContent = `tiles: ${loadedTiles}`;
        });

        const mounted = await mountHeadlessMap(mapEl, {
            mapId,
            mapDataRoot,
            clientDecompression,
            view,
            position: x !== undefined || z !== undefined ? {x, z} : undefined,
            distance
        });

        window.headlessMap = mounted;

        const updateCoords = () => {
            const cm = mounted.viewer.controlsManager;
            coordsEl.textContent = `${mapId} (${Math.round(cm.position.x)}, ${Math.round(cm.position.z)}) d=${Math.round(cm.distance)}`;
        };

        const setButtons = (active) => {
            perspectiveBtn.setAttribute("aria-pressed", String(active === "perspective"));
            flatBtn.setAttribute("aria-pressed", String(active === "flat"));
        };

        perspectiveBtn.addEventListener("click", () => {
            mounted.setView("perspective");
            setButtons("perspective");
            updateCoords();
        });

        flatBtn.addEventListener("click", () => {
            mounted.setView("flat");
            setButtons("flat");
            updateCoords();
        });

        mapEl.addEventListener("bluemapCameraMoved", updateCoords);
        setButtons(view);
        updateCoords();

        statusEl.dataset.state = "loaded";
        statusEl.textContent = `Loaded: ${mounted.map.data.name || mapId}`;
    }

    start().catch((error) => {
        console.error(error);
        statusEl.dataset.state = "error";
        statusEl.textContent = `Error: ${error?.message || error}`;
    });
</script>
</body>
</html>
